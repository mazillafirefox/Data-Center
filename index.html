<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ziemer Data">
<meta name="theme-color" content="#35373A">
<title>Ziemer Data Center — Thailand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#2B2D30; --ink-2:#4D4F53; --ink-3:#868A8F;
  --bg:#F0F1F2; --card:#FFFFFF; --card-2:#F7F8F8; --side:#35373A;
  --line:#E0E2E4; --line-2:#CACDD0;
  --teal:#C4262E; --teal-d:#9E1C24; --teal-l:#FAEAEB;
  --navy:#5B6066; --amber:#B67300; --amber-l:#FBF0DF;
  --red:#9E1C24; --red-l:#F8E7E8; --green:#2E7D5B; --green-l:#E7F2ED;
  --violet:#7A5C86; --grid:#ECEEEF;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(11,31,42,.06),0 4px 12px rgba(11,31,42,.05);
  --sh-2:0 12px 40px rgba(11,31,42,.18);
}
[data-theme=dark]{
  --ink:#E6E8EA; --ink-2:#B4B8BC; --ink-3:#8A8F94;
  --bg:#131517; --card:#1C1F22; --card-2:#232629; --side:#0F1113;
  --line:#2B2F33; --line-2:#3A3F44; --grid:#262A2E;
  --teal:#E0454C; --teal-d:#C4262E; --teal-l:#361618; --amber-l:#2C2109; --red-l:#331516; --green-l:#12291F;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-2:0 14px 44px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
::selection{background:var(--teal);color:#fff}

.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--side) 0 238px,var(--bg) 238px)}
.side{background:var(--side);color:#C8D8E0;padding-bottom:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.09);position:relative;overflow:hidden}
.brand .logo{display:block;width:150px;height:auto}
.brand p{margin:9px 0 0;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#6E8B99;font-family:var(--mono)}
.beam{position:absolute;left:0;bottom:0;height:2px;width:64px;background:linear-gradient(90deg,transparent,#C4262E,#F26B72,transparent);animation:scan 6s cubic-bezier(.7,0,.3,1) infinite}
@keyframes scan{0%{transform:translateX(-70px)}50%{transform:translateX(238px)}100%{transform:translateX(-70px)}}
@media (prefers-reduced-motion:reduce){.beam{animation:none;opacity:.7}}
nav{padding:12px 10px}
.nav-label{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:#546F7D;padding:14px 12px 7px;font-family:var(--mono)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:9px 12px;border-radius:7px;cursor:pointer;color:#B9CCD6;font-size:13.5px;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.on{background:var(--teal);color:#fff;font-weight:500}
.nav-item:focus-visible{outline:2px solid #E0736F;outline-offset:-2px}
.nav-item .ic{width:16px;height:16px;flex:none}
.nav-item .badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.13);padding:1px 6px;border-radius:20px}
.nav-item .badge.alert{background:var(--teal);color:#fff;font-weight:600}
.nav-item.on .badge{background:rgba(255,255,255,.26)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:15px 26px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.top h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:7px;background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:210px}
.search input{border:0;background:none;outline:none;width:100%;font-size:13px}
.search kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line-2);border-radius:4px;padding:0 4px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--card);padding:8px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3);background:var(--card-2)}
.btn:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-d);border-color:var(--teal-d)}
.btn.dgr{color:var(--red);border-color:#E8C4C1}
.btn.dgr:hover{background:var(--red-l)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
.btn.icon{padding:8px 9px}
.content{padding:22px 26px 64px;min-width:0}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--sh);position:relative;overflow:hidden;text-align:left;cursor:default;transition:.15s}
button.kpi{cursor:pointer;width:100%;font:inherit;color:inherit}
button.kpi:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(11,31,42,.12);border-color:var(--line-2)}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal)}
.kpi.n2::after{background:var(--navy)} .kpi.n3::after{background:var(--amber)} .kpi.n4::after{background:var(--violet)} .kpi.n5::after{background:var(--red)} .kpi.n6::after{background:var(--green)}
.kpi .lb{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
.kpi.w2{grid-column:span 2}
.kpi.w2 .vl{font-size:clamp(19px,1.9vw,26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.kpi.w2{grid-column:span 1}.kpi.w2 .vl{white-space:normal}}
.kpi .vl{font-family:var(--mono);font-size:clamp(17px,1.55vw,21px);word-break:break-word;font-weight:600;letter-spacing:-.02em;margin-top:5px;line-height:1.15}
.kpi .ft{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.card>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>header h3{margin:0;font-size:13.5px;font-weight:600}
.card>header .h-sub{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.card .body{padding:16px}
.chart-wrap{position:relative;height:275px}
.zoomBtn{position:absolute;top:-6px;right:-4px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink-3);cursor:pointer;opacity:.45;transition:.15s;z-index:3}
.zoomBtn:hover{opacity:1;color:var(--brand);border-color:var(--brand)}
canvas[data-zoomable]{cursor:zoom-in}
.modal.zoom{max-width:min(1180px,96vw)}
.chart-wrap.tall{height:340px}
.chart-wrap.short{height:210px}
.two{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.three{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}

.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh)}
.crumb{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:8px;font-size:13px;
  font-weight:500;background:var(--card-2);border:1px solid var(--line);cursor:pointer}
.crumb:hover{border-color:var(--teal);color:var(--teal-d)}
.crumb.static{cursor:default;background:none;border-color:transparent;font-weight:600}
.crumb.static:hover{color:inherit}
.crumb-sep{color:var(--ink-3)}
select.f,input.f{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-l);color:var(--teal-d);border:1px solid #EBBFC1;border-radius:20px;padding:4px 6px 4px 11px;font-size:12px;font-weight:500}
.chip button{border:0;background:rgba(0,0,0,.07);border-radius:50%;width:16px;height:16px;line-height:1;cursor:pointer;color:inherit;font-size:11px;display:grid;place-items:center}
.tbl-scroll{overflow:auto;max-height:calc(100vh - 268px);position:relative;-webkit-overflow-scrolling:touch}
.tbl-scroll::-webkit-scrollbar{height:10px;width:10px}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
table.sticky-first td:first-child,table.sticky-first th:first-child{position:sticky;left:0;z-index:4;background:var(--card)}
table.sticky-first th:first-child{z-index:6;background:var(--card-2)}
table.sticky-first tbody tr:hover td:first-child{background:var(--card-2)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--card-2);z-index:5;text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--teal)}
th.n{text-align:right}
th .ar{opacity:.4;font-size:9px}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;white-space:normal;line-height:1.45}
tbody tr:hover{background:var(--card-2)}
tr.expandable{cursor:pointer}
tr.expandable:hover td{background:var(--card-2)}
tr.detail>td{background:var(--card-2);white-space:normal;padding:0}
tr.detail>td>div{position:sticky;left:0;max-width:min(100%,1080px)}
td.act{white-space:nowrap;text-align:right}
.ico-btn{border:0;background:none;cursor:pointer;padding:4px;border-radius:5px;color:var(--ink-3);line-height:0}
.ico-btn:hover{background:var(--line);color:var(--ink)}
.ico-btn.del:hover{background:var(--red-l);color:var(--red)}
tfoot td{background:var(--card-2);font-weight:600;border-top:2px solid var(--line-2);border-bottom:0;position:sticky;bottom:0}
.empty{padding:44px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.tag.ok{background:var(--green-l);color:var(--green)} .tag.no{background:var(--card-2);color:var(--ink-3);border:1px solid var(--line)}
.tag.warn{background:var(--amber-l);color:var(--amber)} .tag.bad{background:var(--red-l);color:var(--red)}
.tag.tl{background:var(--teal-l);color:var(--teal-d)} .tag.nv{background:#EDEEF0;color:var(--navy)}
[data-theme=dark] .tag.nv{background:#2A2E33;color:#B7BDC4}
.meter{display:inline-flex;gap:2px;align-items:center}
.seg{width:9px;height:16px;border-radius:2px;background:var(--line)}
.seg.h{background:#E9A0A3} .seg.f{background:var(--teal)}
.meter .pc{font-family:var(--mono);font-size:11.5px;margin-left:7px;color:var(--ink-2)}

.ov{position:fixed;inset:0;background:rgba(11,31,42,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--card);border-radius:14px;box-shadow:var(--sh-2);width:100%;max-width:780px;}
.modal.wide{max-width:min(1080px,96vw);overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}}
.modal header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:15px;font-weight:600}
.modal .body{padding:18px 20px;max-height:66vh;overflow-y:auto}
.modal footer{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--card-2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.wide{grid-column:1/-1}
.fld label{font-size:11.5px;font-weight:500;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;outline:none;background:var(--card);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.fld input[data-derived]{background:var(--card-2);color:var(--ink-3);cursor:not-allowed}
input.money{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.lines{font-size:12px;margin-top:4px}
table.lines th{position:static;font-size:9.5px;padding:6px 6px;cursor:default}
table.lines td{padding:5px 6px;white-space:nowrap;vertical-align:middle}
table.lines input,table.lines select{border:1px solid var(--line-2);border-radius:6px;padding:4px 6px;font-size:12px;background:var(--card)}
table.lines input{width:88px}
table.lines input.qty{width:56px;text-align:right;font-family:var(--mono)}
table.lines select{min-width:250px;max-width:300px}
table.lines tfoot td{background:var(--card-2);font-weight:600;position:static}
.line-warn{color:var(--amber);font-size:11.5px;margin-top:6px;display:block}
.brand-foot{display:flex;align-items:center;gap:14px;padding:14px 16px}
.brand-foot img{width:132px;height:auto}
.fld textarea{min-height:74px;resize:vertical}
.fld .hint{font-size:11px;color:var(--ink-3)}
.stage-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.stage-row span{flex:1;font-size:13px}
.seg-pick{display:flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg-pick button{border:0;background:var(--card);padding:5px 11px;cursor:pointer;font-size:12px;border-left:1px solid var(--line)}
.seg-pick button:first-child{border-left:0}
.seg-pick button.on{background:var(--teal);color:#fff}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--side);color:#fff;padding:11px 18px;border-radius:9px;box-shadow:var(--sh-2);z-index:200;font-size:13px;animation:up .2s}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.note{background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:8px;padding:11px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
.note.amber{border-left-color:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
h4.sec{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h4.sec::after{content:'';flex:1;height:1px;background:var(--line)}
h4.sec:first-child{margin-top:0}
.bar-list{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;font-size:12.5px}
.bar-row .tr{display:block;grid-column:1/-1;height:6px;background:var(--grid);border-radius:4px;overflow:hidden}
.bar-row .fl{display:block;height:100%;border-radius:4px;background:var(--teal);transition:width .4s ease}
.slider{display:grid;grid-template-columns:1fr;gap:5px;margin-bottom:14px}
.slider .hd{display:flex;justify-content:space-between;font-size:12px}
.slider .hd b{font-family:var(--mono);color:var(--teal-d)}
input[type=range]{width:100%;accent-color:var(--teal);cursor:pointer}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.stat-row:last-child{border-bottom:0}
.stat-row b{font-family:var(--mono)}
.delta.up{color:var(--green)} .delta.dn{color:var(--red)}
.mini{font-size:11.5px;color:var(--ink-3)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line-2);background:var(--card);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer}
.pill.on{background:var(--side);color:#fff;border-color:var(--side)}
.model-pick{display:flex;flex-wrap:wrap;gap:7px}
.model-pick .pill{display:inline-flex;align-items:center;gap:6px;user-select:none}
.model-pick .pill input{width:13px;height:13px;margin:0}
.pv-row{cursor:pointer} .pv-row:hover td{background:var(--card-2)}
.pv-row td:first-child,.pv-sub td:first-child{display:flex;align-items:center;gap:6px}
.pv-chev{display:inline-block;width:14px;color:var(--ink-3);font-size:10px}
.pv-sub td{background:var(--card-2);font-size:12.5px} .pv-sub td:first-child{padding-left:30px;color:var(--ink-2)}
.pv-cell{cursor:pointer} .pv-cell:hover{outline:2px solid var(--teal);outline-offset:-2px}
td.pmc{text-align:center;padding:6px 4px}
.pm-now{background:var(--teal-l)!important;box-shadow:inset 1px 0 0 var(--teal),inset -1px 0 0 var(--teal)}
.pm-head,td.pmc{border-left:1px solid var(--line)}
.pm-head.pm-year,td.pmc.pm-year{border-left:2px solid var(--line-2)}
.pm-head{cursor:grab;user-select:none}
.pm-head:active,body.pm-dragging .pm-head{cursor:grabbing}
body.pm-dragging{user-select:none}
.pmdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ink-3);margin:0 1px}
.pmdot.done{background:var(--green)} .pmdot.overdue{background:var(--red)} .pmdot.due{background:var(--amber)}
.pmdot.planned{background:var(--line-2)} .pmdot.skipped,.pmdot.missed{background:var(--line-2);opacity:.5}
.gauge{display:flex;align-items:center;gap:10px}
.gauge .tr{flex:1;height:8px;background:var(--grid);border-radius:5px;overflow:hidden}
.gauge .fl{height:100%;border-radius:5px}
@media(max-width:900px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  .side{position:static;height:auto}
  nav{display:flex;overflow-x:auto;gap:4px;padding:9px}
  .nav-label{display:none}
  .nav-item{white-space:nowrap;width:auto}
  .content{padding:16px 14px 50px}
  .top{padding:13px 14px}
  .fgrid{grid-template-columns:1fr}
}
</style>

arrantyActive": "Yes", "factoryWarranty": "No", "package": "Gold", "endDate": "", "revenueIncl": 2000000, "costCHF": 25000}, {"company": "ACRS CO., LTD.", "active": "Yes", "model": "FEMTO LDV Z8", "serial": "FLM3309", "location": "Vimut Hospital", "warrantyActive": "Yes", "factoryWarranty": "No", "package": "Gold", "endDate": "", "revenueIncl": 2000000, "costCHF": 25000}], "pipeline": [{"customer": "LASIK Chiang Mai", "config": "FEMTO LDV Z8 Multi with CLEAR application + 2 years warranty", "priceOffer": 18000000, "estPacks": 300, "comment": "Previously, a new FEMTO LDV Z8 system was offered to the doctor at a price of THB 18,000,000, including a 3-year warranty. A demonstration unit was installed for a 6-month evaluation period. However, after the trial period ended, the doctor was still in the negotiation process and had not yet made a purchasing decision.\nThe doctor is currently using a Crystal Line system under a rental arrangement.\nIn June 2026, a demo FEMTO LDV Z8 was subsequently offered at a special price of THB 15,000,000, also including a 3-year warranty. However, no purchase order has been received to date. The doctor indicated that the purchase is likely to take place toward the end of this year.", "timeline": "Q4/2026", "s1": 2, "s2": 2, "s3": 2, "s4": 2, "s5": 2, "s6": 1, "s7": 0, "s8": 0}, {"customer": "Chulalongkorn Hospital", "config": "FEMTO LDV Z8 Multi with CLEAR application, Keratoplasty application, CAIRS application + 2 years warranty", "priceOffer": 30000000, "estPacks": 60, "comment": "The hospital currently owns a FEMTO LDV Z6 system, which was primarily used for corneal transplantation procedures. However, the system is no longer in active clinical use. Following the introduction of CAIRS (Corneal Allogenic Intrastromal Ring Segments) by Ziemer as a treatment option for keratoconus, the hospital showed strong interest in the procedure. As a result, a demo system was installed, and Ziemer invited both a Product Specialist and the research team to support the initial clinical cases in mid-2025. The procedure generated significant interest among the hospital’s ophthalmologists. Based on the positive clinical experience, the hospital plans to replace the existing FEMTO LDV Z6 with a new system. The project is currently under budget approval and internal review, with the hospital seeking approval to allocate funding for the purchase.", "timeline": "Q1/2027", "s1": 2, "s2": 2, "s3": 2, "s4": 1, "s5": 0, "s6": 0, "s7": 0, "s8": 0}, {"customer": "PCMC", "config": "FEMTO LDV Z8 Multi with CLEAR application + 2 years warranty", "priceOffer": 21000000, "estPacks": 60, "comment": "The hospital previously purchased an Excimer Laser system from Filtech. As part of the agreement, Filtech provided the hospital with a FEMTO LDV Z6 system on a long-term loan basis. During the past year, the hospital informed us that Filtech planned to discontinue the loan program because the number of procedures performed was insufficient to justify the ongoing maintenance costs. Consequently, the hospital began seeking funding to purchase its own femtosecond laser system. The hospital initially applied for financial support from the provincial government; however, the request was not approved. To ensure continuity of patient care, DTG installed a demo FEMTO LDV Z8 system as a temporary solution while also assisting the hospital in identifying alternative funding sources. DTG subsequently received information from the Thao Maha Phrom Foundation, which expressed its intention to support the project with funding of approximately THB 7–8 million. Based on this opportunity, DTG proposed the purchase of the demo system. However, the foundation advised that the project must wait for its budget approval process, with preliminary information indicating that funding is expected to become available around 2028.", "timeline": "Q1/2028", "s1": 2, "s2": 2, "s3": 1, "s4": 0, "s5": 0, "s6": 0, "s7": 0, "s8": 0}, {"customer": "Ramathibodi Hospital", "config": "FEMTO LDV Z8 Multi with CLEAR application + 2 years warranty", "priceOffer": 21000000, "estPacks": 60, "comment": "We were informed that the hospital is interested in upgrading to a newer technology and was considering relocating to a new facility. However, during our most recent meeting with the physicians, we were advised that the relocation proposal had not been approved. As a result, the hospital will remain at its current location, where space limitations have become an important consideration. Given these constraints, the Ziemer FEMTO LDV Z8 is considered the most suitable solution due to its compact footprint and efficient space utilization. The product has already been presented to the Head of the Department, and the project is currently under review as part of the hospital’s budget planning and approval process.", "timeline": "Q1/2028", "s1": 2, "s2": 2, "s3": 1, "s4": 0, "s5": 0, "s6": 0, "s7": 0, "s8": 0}, {"customer": "Walailuck University Hospital", "config": "FEMTO LDV Z8 Multi with CLEAR application + 2 years warranty", "priceOffer": 35000000, "estPacks": 300, "comment": "The hospital contacted us to request a product presentation, and a detailed introduction to the Ziemer FEMTO LDV Z8 was conducted in late 2025. The physicians expressed interest in the technology and its clinical capabilities. However, the project has been delayed due to budget allocation constraints. The hospital is currently in the process of securing the necessary budget, and the purchasing decision will be reconsidered once funding becomes available.", "timeline": "", "s1": 2, "s2": 2, "s3": 1, "s4": 0, "s5": 0, "s6": 0, "s7": 0, "s8": 0}, {"customer": "NU Hospital", "config": "FEMTO LDV Z8 Multi with CLEAR application + 2 years warranty", "priceOffer": 21000000, "estPacks": 300, "comment": "We received a referral from an existing customer indicating that the university is planning to upgrade its current technology. An initial introduction to the Ziemer FEMTO LDV Z8 const SQL_SCHEMA=`-- Ziemer Data Center — shared workspace table
-- Run this once in the Supabase SQL editor.

create table if not exists ziemer_workspace (
  id          text primary key,
  data        jsonb not null,
  updated_at  timestamptz not null default now(),
  updated_by  text
);

-- Keep a change history so nothing is lost to a bad save.
create table if not exists ziemer_workspace_history (
  id          bigserial primary key,
  workspace   text not null,
  data        jsonb not null,
  saved_at    timestamptz not null default now()
);

create or replace function ziemer_snapshot() returns trigger as $$
begin
  insert into ziemer_workspace_history(workspace, data) values (old.id, old.data);
  return new;
end; $$ language plpgsql;

drop trigger if exists ziemer_snapshot_trg on ziemer_workspace;
create trigger ziemer_snapshot_trg before update on ziemer_workspace
  for each row execute function ziemer_snapshot();

-- Row level security. Start closed, then open to signed-in users.
alter table ziemer_workspace enable row level security;

-- Option A — anyone with the anon key may read and write (small trusted team only):
drop policy if exists ziemer_anon_all on ziemer_workspace;
create policy ziemer_anon_all on ziemer_workspace
  for all to anon using (true) with check (true);

-- Option B — recommended: drop the policy above and require a login instead.
-- create policy ziemer_auth_all on ziemer_workspace
--   for all to authenticated using (true) with check (true);

insert into ziemer_workspace (id, data) values ('ziemer-th', '{}'::jsonb)
  on conflict (id) do nothing;

  /* — local tiers — */

function accounts(){

    machines:[],packs:[],contracts:[],volume:null,locations:DB.locations.filter(l=>l.accountId===a.id)};
    acc[a.id]=o; byId[a.id]=o; });
  const byName=n=>Object.values(acc).find(a=>a.aliases.has(norm(n)));
  const locAcc={}; DB.locations.forEach(l=>locAcc[l.id]=l.accountId);
  DB.installedBase.forEach(m=>{ const a=byId[locAcc[m.locationId]]||byName(m.company); if(!a) return; a.machines.push(m); bySerial[m.serial]=a; });
  DB.procedurePack.forEach(p=>{ const a=bySerial[p.serial]||byName(p.company); if(!a) return; a.aliases.add(norm(p.company)); a.packs.push(p); });
  DB.serviceContract.forEach(c=>{ const a=bySerial[c.serial]||byName(c.company); if(!a) return; a.aliases.add(norm(c.company)); a.contracts.push(c); });
  const list=Object.values(acc);
  DB.pricingInputs.forEach(i=>{ const n=norm(i.customer);
    const a=list.find(x=>x.key===n)||list.find(x=>!x.volume&&x.aliases.has(n))||list.find(x=>x.key.startsWith(n.slice(0,8)));
    if(a&&!a.volume) a.volume=i; });

      orders:ord.length, orderBoxes:ost.boxes, orderFree:ost.free, revSource:ord.length?'orders':'agreements',
      packRev,packCost,scRev,scCost, total:packRev+scRev, totalGp:gp(exVat(packRev)+exVat(scRev),packCost+scCost),
      contracts_n:scAct.length, attach: a.machines.filter(m=>m.active==='Yes').length? scAct.length/Math.max(1,a.machines.filter(m=>m.active==='Yes').length):0,
      avgVol:an.avg, growth: an.first>0? an.last/an.first-1 : (an.last>0?1:0), price,

  locs.forEach(l=>{ const n=norm(l.name);
    const c=DB.lasikCenters.find(x=>norm(x.hospital)===n)||DB.lasikCenters.find(x=>{const h=norm(x.hospital);
      return h&&n&&(h.startsWith(n)||n.startsWith(h));});
    if(c) l.centre=c.hospital; });
  DB.accounts=accs; DB.locations=locs;
}
function packsOfAccount(id){
  const a=accById(id); if(!a) return [];
  const locIds=new Set(DB.locations.filter(l=>l.accountId===id).map(l=>l.id));
  const ser=new Set(DB.installedBase.filter(m=>locIds.has(m.locationId)).map(m=>m.serial));
  return DB.procedurePack.filter(p=>ser.has(p.serial)||norm(p.company)===norm(a.name));
}
const packPriceOfAccount=id=>{
  const os=ordersOfAccount(id);                       /* real shipments win */
  if(os.length){ const st=orderStats(os); if(st.boxes&&st.incl>0) return st.incl/st.boxes; }
  const ps=packsOfAccount(id).map(packAgg).filter(x=>x.boxes>0&&x.revenueIncl>0);
  if(!ps.length) return null;
  const boxes=ps.reduce((s,x)=>s+x.boxes,0), rev=ps.reduce((s,x)=>s+x.revenueIncl,0);
  return boxes?rev/boxes:null; };
function syncAll(){
  syncDenorm();
  linkOrders();
  DB.pmPlan=DB.pmPlan||[];
  const ids=new Set(DB.serviceContract.map(c=>c.id));
  DB.pmPlan=DB.pmPlan.filter(s=>ids.has(s.contractId));
  DB.serviceContract.forEach(generatePM);
  matchPMVisits();
  const roll=accounts();
  const linked=id=>DB.pricingInputs.find(p=>p.accountId===id);
  const claim=(a,pi)=>{ pi.accountId=a.id; pi.customer=a.name; };
  // 1. exact name match wins, so a dealer never steals its customer's row
  roll.forEach(a=>{ if(linked(a.id)) return;
    const pi=DB.pricingInputs.find(p=>!p.accountId&&norm(p.customer)===norm(a.name)); if(pi) claim(a,pi); });
  // 2. then trading names picked up from pack and contract records
  roll.forEach(a=>{ if(linked(a.id)) return;
    const names=new Set([...a.aliases,...DB.locations.filter(l=>l.accountId===a.id).map(l=>norm(l.name))]);
    const pi=DB.pricingInputs.find(p=>!p.accountId&&names.has(norm(p.customer))); if(pi) claim(a,pi); });
  // 3. any account that buys packs but has no volume row yet gets one
  roll.forEach(a=>{ const price=packPriceOfAccount(a.id);
    let pi=linked(a.id);
    if(!pi&&price){ pi={id:uid(),accountId:a.id,customer:a.name,include:'Y',priceIncl:price,priceSource:'auto',vol:{}};
      DB.pricingInputs.push(pi); }
    if(pi){ pi.customer=a.name;
      if(!pi.priceSource) pi.priceSource='auto';
      if(pi.priceSource!=='manual'&&price) pi.priceIncl=price;      /* stays linked to the deals */
      if(!(+pi.priceIncl)&&price) pi.priceIncl=price; } });
  volumesFromOrders();          /* last, once every row knows its account */
}
function syncDenorm(){
  DB.installedBase.forEach(m=>{ const l=locById(m.locationId); if(!l) return; const a=accById(l.accountId);
    m.location=l.name; m.province=l.province; m.address=l.address; m.road=l.road; m.subDistrict=l.subDistrict;
    m.district=l.district; m.postCode=l.postCode; m.contact=l.contact; m.contactTel=l.tel; m.buyer=l.buyer;
    m.buyerTel=l.buyerTel; m.email=l.email; if(a){ m.company=a.name; m.taxId=a.taxId; } });
  [...DB.procedurePack,...DB.serviceContract].forEach(r=>{ const m=DB.installedBase.find(x=>x.serial===r.serial);
    if(m){ r.company=m.company; r.location=m.location; r.model=m.model; r.active=m.active; } });
  DB.installedBase.forEach(m=>{
    const c=currentContract(m.serial);
    m.contractId=c?c.id:''; m.contractPackage=c&&c.warrantyActive==='Yes'?c.package:'';
    m.contractStart=c?c.startDate||'':''; m.contractEnd=c?c.endDate||'':'';
    m.contractValue=c&&c.warrantyActive==='Yes'?+c.revenueIncl||0:0;
    const today=dISO(new Date());
    m.covered=(c&&c.warrantyActive==='Yes'&&(!c.endDate||c.endDate>=today))?'Yes':'No';
    m.pmMonths=c?c.pmMonths||'':''; m.contractCount=contractsOf(m.serial).length;
    m.contractLifetime=sum(contractsOf(m.serial),'revenueIncl'); });
}

const CSSV=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const PAL=['#C4262E','#4D4F53','#B67300','#47708F','#2E7D5B','#7A5C86','#B9BEC2','#E0736F','#7D8B4F'];
let CHART_CFG={};
function chart(id,cfg){ const el=document.getElementById(id); if(!el) return;
  if(typeof Chart==='undefined'){ el.parentNode.innerHTML='<div class="empty">Charts need an internet connection to load Chart.js.</div>'; return; }
  try{ charts.push(new Chart(el,cfg)); CHART_CFG[id]=cfg;
    const wrap=el.closest('.chart-wrap');
    if(wrap&&!wrap.querySelector('.zoomBtn')){
      wrap.style.position='relative';
      const t=(el.closest('.card')||{}).querySelector?((el.closest('.card').querySelector('header h3')||{}).textContent||''):'';
      wrap.insertAdjacentHTML('beforeend',
        `<button class="zoomBtn" data-zoom="${id}" data-title="${esc(t)}" title="Open this chart full size">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>`); }
    if(!(cfg.options&&cfg.options.onClick)) el.dataset.zoomable='1';
  }catch(e){} }
function killCharts(){ charts.forEach(c=>{try{c.destroy()}catch(e){}}); charts=[]; CHART_CFG={}; }
function openZoom(id,title){
  const cfg=CHART_CFG[id]; if(!cfg||typeof Chart==='undefined') return;
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="modal zoom"><header><h3>${esc(title||'Chart')}</h3><span class="spacer"></span>
      <button class="btn sm" data-x>Close</button></header>
    <div class="body" style="padding:16px 18px 22px;overflow:hidden"><div style="height:min(58vh,600px)"><canvas id="zoomCanvas"></canvas></div></div></div>`;
  document.body.appendChild(ov);
  const close=()=>{ try{ zc&&zc.destroy(); }catch(e){} ov.remove(); };
  ov.querySelector('[data-x]').onclick=close;
  ov.onclick=e=>{ if(e.target===ov) close(); };
  const big={ type:cfg.type,
    data:JSON.parse(JSON.stringify(cfg.data)),
    options:{...(cfg.options||{}), maintainAspectRatio:false, onClick:null,
      plugins:{...((cfg.options||{}).plugins||{}),
        legend:{...(((cfg.options||{}).plugins||{}).legend||{}),display:((((cfg.options||{}).plugins||{}).legend||{}).display)!==false}}} };
  let zc=null;
  try{ zc=new Chart(ov.querySelector('#zoomCanvas'),big); }catch(e){ console.error(e); }
}
let gridX,gridY;
function chartTheme(){ if(typeof Chart==='undefined') return;
  Chart.defaults.font.family="'IBM Plex Mono','IBM Plex Sans',monospace"; Chart.defaults.font.size=11; Chart.defaults.color=CSSV('--ink-3');
  gridX={grid:{display:false},border:{display:false}}; gridY={grid:{color:CSSV('--grid')},border:{display:false}}; }
const clickPick=(key)=>(e,els,ch)=>{ if(!els.length) return; const lb=ch.data.labels[els[0].index]; GF[key]=GF[key]===lb?null:lb; render(); };

function pageDash(){

  /* renewals are a per-machine question: only the contract in force (or the last one bought)
     counts, otherwise an old lapsed purchase keeps showing up beside its own replacement */
  const currentSc=[...new Set(ib.map(m=>m.serial))].map(s=>currentContract(s))
    .filter(Boolean).map(CFG.svc.compute);
  const coveredN=act.filter(m=>m.covered==='Yes').length;

  const scRev=sum(scAct,'revenueIncl'),scCost=sum(scAct,'landed'),scEx=sum(scAct,'exVat');
  const expiring=currentSc.filter(r=>r.days!=null&&r.days<365).sort((a,b)=>a.days-b.days);

    ${kpi('Blended GP',fmtP(gp(ppEx+scEx,ppCost+scCost)),`Packs ${fmtP(gp(ppEx,ppCost))} · Service ${fmtP(gp(scEx,scCost))}`,'n3','analytics')}
    ${kpi('Pipeline value',fmtMs(sum(pl,'priceOffer')),`Weighted ${fmtMs(sum(pl,'weighted'))} across ${pl.length} deals`,'n4','pipe')}
    ${kpi('Renewal at risk (12m)',fmtMs(atRisk),`${expiring.length} machine${expiring.length===1?'':'s'} expiring or already lapsed`,'n5','svc')}
    ${(()=>{ const al=pmAlerts(), od=al.filter(s=>pmStatus(s)==='overdue');
      return kpi('PM due or overdue',al.length,
        od.length?`${od.length} already overdue · oldest ${agoText(pmDays(od[0]))}`

        od.length?'n5':'n3','pm'); })()}
  </div>

  <div class="grid two">

      <div class="body"><div class="chart-wrap"><canvas id="c1"></canvas></div></div></div>
    <div class="card"><header><h3>Femtosecond laser share of LASIK centres</h3><span class="spacer"></span><span class="h-sub">Ziemer ${zi.length}/${wf.length}</span></header>
      <div class="body"><div class="chart-wrap"><canvas id="c2"></canvas></div></div></div>
  </div>
  <h4 class="sec">Revenue, margin and fleet age</h4>
  <div class="grid two">
    <div class="card"><header><h3>Revenue vs landed cost by stream</h3></header>
      <div class="body"><div class="chart-wrap"><canvas id="c3"></canvas></div>
      <div class="legend"><span><i style="background:${PAL[0]}"></i>Revenue (ex VAT)</span><span><i style="background:${PAL[6]}"></i>Landed cost</span></div></div></div>
    <div class="card"><header><h3>Installations per year</h3><span class="spacer"></span><span class="h-sub">click a year to filter</span></header>
      <div class="body"><div class="chart-wrap"><canvas id="c4"></canvas></div></div></div>
  </div>
  <h4 class="sec">Pipeline and renewals</h4>

function kpi(l,v,f,c,go){ const t=`<div class="lb">${l}</div><div class="vl">${v}</div><div class="ft">${f}</div>`;

function chipBar(){

/* ═══════════ ANALYTICS ═══════════ */
function pageAnalytics(){
  let acc=accounts(); if(GF.account) acc=acc.filter(a=>a.name===GF.account);
  const S=scope();
  const act=S.machines.filter(m=>m.active==='Yes');
  const sc=S.contracts.filter(c=>c.warrantyActive==='Yes');
  const covered=new Set(sc.map(c=>c.serial));
  const uncovered=act.filter(m=>!covered.has(m.serial));
  const packSer=new Set(S.packs.filter(p=>+p.revenueIncl>0).map(p=>p.serial));

function scenario(pAdj,vAdj,fx){
  const cost1=(+A().purchaseCHF||0)/fx*A().freightConsumables;
  let rev=0,vol=0;
  DB.pricingInputs.forEach(r=>{const v=annualized(r).avg*(1+vAdj); vol+=v; rev+=exVat((+r.priceIncl||0)*(1+pAdj))*v;});
  const cost=cost1*vol;
  return {rev,cost,vol,gpAbs:rev-cost,gpPct:gp(rev,cost)};
}
function drawPrice(){

  const ui=DB.ui||{}, b=scenario(0,0,A().fx), s=scenario(ui.pAdj??0,ui.vAdj??0,ui.fx??A().fx);

}
function refreshScenario(){
  const ui=DB.ui||(DB.ui={}), b=scenario(0,0,A().fx), s=scenario(ui.pAdj??0,ui.vAdj??0,ui.fx??A().fx);
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.innerHTML=v;};
  set('sRev',fmtM(s.rev)); set('sCost',fmtM(s.cost)); set('sGp',fmtM(s.gpAbs)); set('sGpP',fmtP(s.gpPct)); set('sVol',fmtN(s.vol,1)+' boxes/yr');

  set('sRevD',d(s.rev,b.rev)); set('sGpD',d(s.gpAbs,b.gpAbs));

function completeness(k){ const req=REQUIRED[k],rows=DB[k]; if(!rows.length) return {pct:0,miss:[]};
  let filled=0,tot=0; const miss={};
  rows.forEach(r=>req.forEach(f=>{tot++; const v=r[f]; if(v!==''&&v!=null&&v!=='-'&&!(f==='endDate'&&!v)) filled++; else miss[f]=(miss[f]||0)+1;}));
  return {pct:filled/tot, miss:Object.entries(miss).sort((a,b)=>b[1]-a[1])};
}

/* ─── render ─── */
function render(){
  killCharts(); chartTheme();
  try{ document.getElementById('nav').innerHTML=navHTML(); }catch(err){ console.error(err); }
  const v=VIEWS[page];
  let ttl=v.title, sub=v.sub;
  if(page==='machine'){ const m=DB.installedBase.find(x=>x.id===machineId);
    if(m){ const l=locById(m.locationId)||{}, a=accById(l.accountId)||{};
      ttl=a.name||m.company||'Machine record';
      sub=[l.name||m.location, m.model, 'Serial '+m.serial].filter(Boolean).join('  ·  '); } }
  document.getElementById('pgTitle').textContent=ttl;
  document.getElementById('pgSub').textContent=sub;
  const searchable=v.key||page==='c360';
  document.getElementById('searchBox').style.display=searchable?'flex':'none';
  document.getElementById('btnAdd').style.display=(v.key&&page!=='pm'&&page!=='svc')?'inline-flex':'none';
  const el=document.getElementById('view');
  try{
    el.innerHTML = page==='io'?pageIO():page==='packan'?pagePackAnalytics():page==='orders'?pageOrders():page==='svc'?pageContracts()
      :page==='pm'?pagePM():page==='machine'?pageMachine():page==='catalog'?pageCatalog():page==='dash'?pageDash()
      :page==='analytics'?pageAnalytics():page==='c360'?pageAccounts()
      :page==='pipe'?pagePipe():page==='market'?pageMarket():page==='price'?pagePrice():page==='data'?pageData()
      :tableCard(CFG[page])+(page==='base'?ageLegend():'');
  }catch(err){ console.error(err);
    el.innerHTML=`<div class="note amber"><b>This page could not be drawn.</b> ${esc(err&&err.message||String(err))}
      <br><span class="mini">Build ${BUILD} · page “${esc(page)}” — send us this line and we can trace the record behind it.</span></div>
      <div class="toolbar"><button class="btn" data-p="data">Open Data &amp; Quality</button>
        <button class="btn" id="expJson">Download a JSON backup</button></div>`; }
  requestAnimationFrame(()=>{ try{ if(page==='dash')drawDash(); if(page==='analytics')drawAnalytics(); if(page==='pipe')drawPipe();
    if(page==='orders')drawOrders(); if(page==='packan')drawPackAnalytics(); if(page==='market')drawMarket();
    if(page==='price'){drawPrice();refreshScenario();} }catch(err){ console.error(err); } });
  document.getElementById('q').value=query;
  const bs=document.getElementById('btnSync'); if(bs) bs.style.display=Store.remote?'inline-flex':'none';
  saveBadge();
}

/* ─── modal ─── */
function openImport(key){
  const label=TABLE_LABELS[key]||key, keyField=TABLE_KEYS[key]||'id';
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="modal"><header><h3>Import into ${esc(label)}</h3></header>
    <div class="body">
      <div class="fld"><label>File</label><input type="file" id="impFile">
        <span class="hint">CSV or JSON. On iPad the picker shows every file — pick the one you exported.</span></div>
      <div class="fld" style="margin-top:12px"><label>…or paste the rows here</label>
        <textarea id="impText" rows="5" placeholder="Paste CSV (with a header row) or JSON exported from this app"></textarea>
        <button type="button" class="btn sm" id="impRead" style="margin-top:8px;align-self:flex-start">Read the pasted text</button></div>
      <div class="fld" style="margin-top:12px"><label>What to do with the rows</label>
        <select id="impMode">
          <option value="add">Add new records only</option>
          <option value="upsert" selected>Update matches and add the rest</option>
          <option value="replace">Replace the whole table</option>
        </select>
        <span class="hint">Records are matched on <b>${esc(keyField)}</b></span></div>
      <div class="note" id="impPrev" style="margin-top:14px">Choose a file and the contents are checked before anything is written.</div>
    </div>
    <footer><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok disabled>Import</button></footer></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('[data-x]').onclick=close;
  ov.onclick=e=>{ if(e.target===ov) close(); };
  let parsed=null;
  const show=(name,text)=>{ const box=ov.querySelector('#impPrev');
      try{
        parsed=rowsFromFile(key,name,text);
        const known=new Set((DB[key]||[]).flatMap(r=>Object.keys(r)));
        const unknown=parsed.cols.filter(c=>known.size&&!known.has(c));
        const existing=new Set((DB[key]||[]).map(r=>String(r[keyField]??'').toLowerCase()));
        const match=parsed.rows.filter(r=>existing.has(String(r[keyField]??'').toLowerCase())).length;
        const missingKey=parsed.rows.filter(r=>!String(r[keyField]??'').trim()).length;
        box.className='note';
        box.innerHTML=`<b>${parsed.rows.length}</b> row${parsed.rows.length===1?'':'s'} · ${parsed.cols.length} columns
          · <b>${match}</b> match an existing record on ${esc(keyField)} · <b>${parsed.rows.length-match}</b> would be new
          ${missingKey?`<br><span style="color:var(--amber)">${missingKey} row${missingKey===1?'':'s'} have no ${esc(keyField)} — they can only be added, never matched</span>`:''}
          ${unknown.length?`<br><span class="mini">New columns carried in: ${unknown.map(esc).join(', ')}</span>`:''}`;
        ov.querySelector('[data-ok]').disabled=false;
      }catch(err){ parsed=null; box.className='note amber';
        box.innerHTML=`<b>That could not be read.</b> ${esc(err.message||err)}`;
        ov.querySelector('[data-ok]').disabled=true; }
  };
  ov.querySelector('#impFile').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onerror=()=>{ ov.querySelector('#impPrev').className='note amber';
      ov.querySelector('#impPrev').innerHTML='<b>The browser could not read that file.</b> Try pasting the rows instead.'; };
    fr.onload=()=>show(f.name,fr.result);
    fr.readAsText(f);
  });
  ov.querySelector('#impRead').addEventListener('click',()=>{
    const t=ov.querySelector('#impText').value.trim();
    if(!t){ ov.querySelector('#impText').focus(); return; }
    show(/^[\[{]/.test(t)?'pasted.json':'pasted.csv',t);
  });
  ov.querySelector('[data-ok]').onclick=()=>{
    if(!parsed) return;
    const mode=ov.querySelector('#impMode').value;
    const before=(DB[key]||[]).length;
    let added=0, updated=0;
    if(mode==='replace'){
      if(!confirm(`Delete all ${before} records in ${label} and load ${parsed.rows.length} from the file?`)) return;
      DB[key]=parsed.rows.map(r=>({id:r.id||uid(),...r})); added=parsed.rows.length;
    } else {
      parsed.rows.forEach(r=>{ const k=String(r[keyField]??'').trim();
        const i=k?DB[key].findIndex(x=>String(x[keyField]??'').toLowerCase()===k.toLowerCase()):-1;
        if(i>=0){ if(mode==='upsert'){ DB[key][i]={...DB[key][i],...r,id:DB[key][i].id}; updated++; } }
        else { DB[key].push({id:r.id||uid(),...r}); added++; } });
    }
    syncAll(); save(); close(); render();
    toast(`${label}: ${added} added${updated?`, ${updated} updated`:''} — now ${(DB[key]||[]).length} records`);
  };
}
function openPicker(title,pairs,onPick){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="modal" style="max-width:460px"><header><h3>${title}</h3></header>
    <div class="body"><div class="fld"><label>Account</label><select id="pkSel">${pairs.map(p=>`<option value="${esc(p.v)}">${esc(p.l)}</option>`).join('')}</select></div></div>
    <footer><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>Add</button></footer></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('[data-x]').onclick=close; ov.onclick=e=>{ if(e.target===ov) close(); };
  ov.querySelector('[data-ok]').onclick=()=>{ const v=ov.querySelector('#pkSel').value; close(); onPick(v); };
}
function fieldOpts(f){ return (f.opts?f.opts():f.op)||[]; }
function fieldHTML(f,rec){
  if(f.in==='stages') return `<div class="fld wide"><label>${f.label}</label>
    ${STAGES.map((s,i)=>`<div class="stage-row"><span>${i+1}. ${s.n}</span><div class="seg-pick" data-sk="${s.k}">
      ${[0,1,2].map(v=>`<button type="button" data-v="${v}" class="${(+rec[s.k]||0)===v?'on':''}">${['Not started','In progress','Done'][v]}</button>`).join('')}</div></div>`).join('')}</div>`;
  const cur=rec[f.k]??f.def??'', val=esc(cur);
  let inp;
  if(f.derived) inp=`<input data-fk="${f.k}" data-derived="1" value="${val}" readonly tabindex="-1">`;
  else if(f.in==='select'){
    if(f.pairs){ const pr=f.pairs();
      inp=`<select data-fk="${f.k}" ${f.link?'data-link="1"':''} ${f.cat?'data-cat="1"':''}><option value=""></option>${pr.map(o=>`<option value="${esc(o.v)}" ${String(cur)===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')}</select>`; }
    else { const o=fieldOpts(f).map(String), all=(cur===''||o.includes(String(cur)))?o:[String(cur),...o];
      inp=`<select data-fk="${f.k}" ${f.link?'data-link="1"':''} ${f.pkg?'data-pkg="1"':''} ${f.cat?'data-cat="1"':''}><option value=""></option>${all.map(x=>`<option ${String(cur)===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`; } }
  else if(f.in==='datalist'){ const lid='dl_'+f.k;
    inp=`<input data-fk="${f.k}" list="${lid}" value="${val}" autocomplete="off"><datalist id="${lid}">${fieldOpts(f).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`; }
  else if(f.in==='models'){
    const sel=Array.isArray(cur)?cur:[];
    return `<div class="fld wide"><label>${f.label}</label>
      <div class="model-pick" data-models="${f.k}">
        ${M('models').map(m=>`<label class="pill ${sel.includes(m)?'on':''}"><input type="checkbox" value="${esc(m)}" ${sel.includes(m)?'checked':''}> ${esc(m.replace(/^FEMTO LDV /,''))}</label>`).join('')}
      </div>
      <span class="hint">${sel.length?`${sel.length} model${sel.length===1?'':'s'} selected`:'Nothing ticked means it fits every model'}${rec.forDevices?` · price list says “${esc(rec.forDevices)}”`:''}</span></div>`;
  }
  else if(f.in==='partlines') return `<div class="fld wide"><label>${f.label}</label><div id="partWrap"></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:9px">
      <button type="button" class="btn sm" id="addPart">+ Add part</button>
      <span id="partFitBox"></span><span class="hint" id="partNote"></span></div></div>`;
  else if(f.in==='lines') return `<div class="fld wide"><label>${f.label}</label><div id="lineWrap"></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:9px">
      <button type="button" class="btn sm" id="addLine">+ Add item</button>
      <span id="fitBox"></span>
      <span class="hint" id="fitNotePack"></span>
      <span class="line-warn" id="lineWarn"></span></div></div>`;
  else if(f.in==='month') inp=`<input data-fk="${f.k}" type="month" value="${val}">`;
  else if(f.in==='orderlines') return `<div class="fld wide"><label>${f.label}</label><div id="ordWrap"></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:9px">
      <button type="button" class="btn sm" id="addOrdLine">+ Add item</button>
      <span class="hint" id="ordNote">Quantity is in EA — 10 EA makes one box</span></div></div>`;
  else if(f.in==='money') inp=`<input data-fk="${f.k}" data-money="1" class="money" type="text" inputmode="decimal" value="${fmtAcct(cur)}">`;

function toCSV(key){
  const rows=DB[key]; if(!rows.length) return;
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(c=>c!=='id');
  const csv=[cols.join(','),...rows.map(r=>cols.map(c=>{ let v=r[c]??'';
    if(typeof v==='object') v=JSON.stringify(v);
    return /[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v;}).join(','))].join('\n');
  dl(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),key+'.csv'); toast('CSV downloaded');
}

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  text=String(text).replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
function numericFields(key){
  const set=new Set();
  (DB[key]||[]).forEach(r=>Object.entries(r).forEach(([k,v])=>{ if(typeof v==='number') set.add(k); }));
  return set;
}
function rowsFromFile(key,name,text){
  if(/\.json$/i.test(name)){ const j=JSON.parse(text);
    const arr=Array.isArray(j)?j:(Array.isArray(j[key])?j[key]:null);
    if(!arr) throw new Error('That JSON does not contain a list of records');
    return {cols:[...new Set(arr.flatMap(o=>Object.keys(o)))],rows:arr}; }
  const csv=parseCSV(text);
  if(csv.length<2) throw new Error('The file has no data rows');
  const cols=csv[0].map(c=>c.trim()), nums=numericFields(key);
  const rows=csv.slice(1).map(line=>{ const o={};
    cols.forEach((c,i)=>{ let v=(line[i]??'').trim();
      if(v==='') { o[c]=''; return; }
      if(nums.has(c)){ const n=parseNum(v); o[c]=n==null?v:n; }
      else if(/^\[.*\]$|^\{.*\}$/.test(v)){ try{ o[c]=JSON.parse(v); }catch(e){ o[c]=v; } }
      else o[c]=v; });
    return o; });
  return {cols,rows};
}
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);};

let pmDrag=null;
const pmDragStart=(x)=>{ pmDrag={x,base:pmOffset}; document.body.classList.add('pm-dragging'); };
const pmDragMove=(x)=>{ if(!pmDrag) return;
  const step=Math.round((pmDrag.x-x)/46);
  const next=Math.max(-12,Math.min(12,pmDrag.base+step));
  if(next!==pmOffset){ pmOffset=next; render(); } };
const pmDragEnd=()=>{ pmDrag=null; document.body.classList.remove('pm-dragging'); };
document.addEventListener('mousedown',e=>{ if(e.target.closest('.pm-head')){ e.preventDefault(); pmDragStart(e.clientX); } });
document.addEventListener('mousemove',e=>{ if(pmDrag) pmDragMove(e.clientX); });
document.addEventListener('mouseup',pmDragEnd);
document.addEventListener('touchstart',e=>{ if(e.target.closest('.pm-head')) pmDragStart(e.touches[0].clientX); },{passive:true});
document.addEventListener('touchmove',e=>{ if(pmDrag){ e.preventDefault(); pmDragMove(e.touches[0].clientX); } },{passive:false});
document.addEventListener('touchend',pmDragEnd);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ const ovs=[...document.querySelectorAll('.ov')];
    const top=ovs[ovs.length-1];

    if(q&&q.offsetParent){ e.preventDefault(); q.focus(); } }
});
